name: wake
# A change to wants.json starts a price check right away (tick.yml handles the regular schedule).
on:
  push:
    branches: [main]
    paths: [game-price-watcher/wants.json]
permissions: { actions: write }
jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: '${{ github.token }}', EVENT: '${{ github.event_name }}' }
        run: |
          gh workflow run game-prices.yml -R "$GITHUB_REPOSITORY" --ref main
