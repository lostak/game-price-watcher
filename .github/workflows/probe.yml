name: probe
on: { workflow_dispatch: {} }
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults: { run: { working-directory: game-price-watcher } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: node probe.js
        env: { HEADFUL: '1' }
