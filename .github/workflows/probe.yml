name: probe
# Manual tests: 'sites' = which ticket sites answer from a GitHub runner; 'elsewhere' = the hourly from-price scrape (prints, writes nothing).
on:
  workflow_dispatch:
    inputs: { what: { type: choice, options: [elsewhere, sites], default: elsewhere } }
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: game-price-watcher } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - if: inputs.what == 'sites'
        run: xvfb-run -a node probe.js && xvfb-run -a node probe.js --events
      - if: inputs.what == 'elsewhere'
        run: xvfb-run -a node elsewhere.js --test
