name: run-script
# Manual run of one of the calendar scripts (for testing or a re-run): brief, recap, grade, pool, ski.
on:
  workflow_dispatch:
    inputs:
      script: { description: 'brief | recap | grade | pool | ski', required: true, type: string }
      args: { description: 'extra args, e.g. --force', required: false, default: '--force', type: string }
permissions: { contents: write }
concurrency: { group: run-script, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: game-price-watcher } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env:
          GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}'
          GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}'
          S: '${{ inputs.script }}'
          A: '${{ inputs.args }}'
        run: |
          case "$S" in
            brief|recap|grade) node "$S.js" $A ;;
            pool|ski) node rotations.js "$S" ;;
            *) echo "unknown script $S"; exit 1 ;;
          esac
