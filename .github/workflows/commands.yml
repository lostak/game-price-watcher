name: discord-commands
# Every 5 minutes: read new messages in the Discord game-prices channel ("watch Nuggets vs Suns Nov 20 under 80",
# "stop all", "list", "report") and apply them. Needs DISCORD_BOT_TOKEN + DISCORD_CHANNEL_ID.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency: { group: game-commands, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults: { run: { working-directory: game-price-watcher } }
    steps:
      - uses: actions/checkout@v4
      - id: cmd
        env:
          DISCORD_BOT_TOKEN: '${{ secrets.DISCORD_BOT_TOKEN }}'
          DISCORD_CHANNEL_ID: '${{ secrets.DISCORD_CHANNEL_ID }}'
          DISCORD_WEBHOOK_URL: '${{ secrets.DISCORD_WEBHOOK_URL }}'
          GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}'
          GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}'
        run: |
          set +e; node commands.js; rc=$?; set -e
          [ "$rc" = "3" ] && echo "changed=yes" >> "$GITHUB_OUTPUT"
          [ "$rc" = "4" ] && echo "report=yes" >> "$GITHUB_OUTPUT"
          [ "$rc" = "0" ] || [ "$rc" = "3" ] || [ "$rc" = "4" ]
      - name: Save cursor / wants, wake the watcher
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git config user.name game-price-watcher && git config user.email game-price-watcher@users.noreply.github.com
          git add state/discord.json wants.json && (git diff --cached --quiet || (git commit -m "discord: ${{ steps.cmd.outputs.changed == 'yes' && 'wants updated from Discord' || 'cursor' }}" && git pull --rebase -q && git push))
          if [ "${{ steps.cmd.outputs.changed }}" = "yes" ] || [ "${{ steps.cmd.outputs.report }}" = "yes" ]; then
            gh workflow enable game-prices.yml -R "$GITHUB_REPOSITORY" || true
            gh workflow run game-prices.yml -R "$GITHUB_REPOSITORY" --ref main -f report=${{ steps.cmd.outputs.report == 'yes' }}
          fi
