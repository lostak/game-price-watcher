name: game-prices
on:
  schedule:
    # Every 30 minutes, 5 AM–10 PM Denver (UTC hours cover MST and MDT; the gate trims the edges).
    - cron: '7,37 0-4,11-23 * * *'   # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:
    inputs:
      dry: { description: 'Dry run (read only, no Slack/Discord, no state)', type: boolean, default: false }
      debug: { description: 'Verbose log', type: boolean, default: false }
      discover: { description: 'Refresh the home-game schedule now', type: boolean, default: false }
concurrency: { group: game-prices, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: game-price-watcher } }
    steps:
      - uses: actions/checkout@v4
      - name: Gate (quiet hours, anything to watch?)
        id: gate
        env: { GH_TOKEN: '${{ github.token }}', EVENT: '${{ github.event_name }}' }
        run: |
          today=$(TZ=America/Denver date +%F); h=$((10#$(TZ=America/Denver date +%H)))
          if [ "$EVENT" = "schedule" ] && { [ "$h" -ge 22 ] || [ "$h" -lt 5 ]; }; then
            echo "Quiet hours (10 PM–5 AM) – skipping."; echo "run=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A check is active when a known home game (cached schedule or wants.json) is within daysAhead,
          # or the cached schedule is older than a day (so it gets refreshed).
          n=$(node -e "
            const c=require('./wants.json'), s=require('./state/games.json');
            const until=new Date(Date.now()+(c.daysAhead||14)*864e5).toISOString().slice(0,10);
            const g=[...(s.games||[]),...(c.games||[])].filter(x=>x.date>='$today'&&x.date<=until);
            const stale=!s.updated||Date.now()-Date.parse(s.updated)>864e5;
            console.log(g.length||(stale?'stale':0))")
          if [ "$n" = "0" ] && [ "$EVENT" = "schedule" ]; then
            echo "No home games within range – pausing until the daily wake-up or a wants.json change."
            gh workflow disable game-prices.yml -R "$GITHUB_REPOSITORY" || true
            echo "run=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Active ($n)."; echo "run=yes" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'yes'
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - if: steps.gate.outputs.run == 'yes'
        run: npm install --no-audit --no-fund
      # No browser download: the runner's own Google Chrome is used (chromium.launch({ channel: 'chrome' })).
      - if: steps.gate.outputs.run == 'yes'
        run: node watch.js ${{ inputs.dry && '--dry' || '' }} ${{ inputs.debug && '--debug' || '' }} ${{ inputs.discover && '--discover' || '' }}
        env: { SLACK_WEBHOOK_URL: '${{ secrets.SLACK_WEBHOOK_URL }}', DISCORD_WEBHOOK_URL: '${{ secrets.DISCORD_WEBHOOK_URL }}' }
      - name: Save state
        if: steps.gate.outputs.run == 'yes' && !inputs.dry
        run: |
          git config user.name game-price-watcher && git config user.email game-price-watcher@users.noreply.github.com
          git add state/seen.json state/games.json && (git diff --cached --quiet || (git commit -m "game prices: update state" && git pull --rebase -q && git push))
