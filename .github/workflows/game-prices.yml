name: game-prices
# Started by tick.yml every 5 minutes (5 AM–10 PM, while a home game is within 14 days), by Discord/Pocket commands,
# and on demand. No cron of its own.
on:
  workflow_dispatch:
    inputs:
      dry: { description: 'Dry run (read only, no Discord, no state)', type: boolean, default: false }
      debug: { description: 'Verbose log', type: boolean, default: false }
      discover: { description: 'Refresh the home-game schedule now', type: boolean, default: false }
      report: { description: 'Also post the price board', type: boolean, default: false }
      daily: { description: 'Post the board only if it has not gone out yet today', type: boolean, default: false }
concurrency: { group: game-prices, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: game-price-watcher } }
    steps:
      - uses: actions/checkout@v4
      - name: Gate (quiet hours, anything to watch?)
        id: gate
        env: { GH_TOKEN: '${{ github.token }}', EVENT: '${{ github.event_name }}' }
        run: |
          today=$(TZ=America/Denver date +%F); h=$((10#$(TZ=America/Denver date +%H)))
          if [ "$EVENT" = "schedule" ] && { [ "$h" -ge 22 ] || [ "$h" -lt 5 ]; }; then
            echo "Quiet hours (10 PM–5 AM) – skipping."; echo "run=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A check is active when a known home game (cached schedule or wants.json) is within daysAhead,
          # or the cached schedule is older than a day (so it gets refreshed).
          n=$(node -e "
            const c=require('./wants.json'), s=require('./state/games.json');
            const until=new Date(Date.now()+(c.daysAhead||14)*864e5).toISOString().slice(0,10);
            const g=[...(s.games||[]).filter(x=>x.date<=until),...(c.games||[])].filter(x=>x.date>='$today');
            const stale=!s.updated||Date.now()-Date.parse(s.updated)>864e5;
            console.log(g.length||(stale?'stale':0))")
          if [ "$n" = "0" ] && [ "$EVENT" = "schedule" ]; then
            echo "No home games within range – nothing to do (the daily wake-up refreshes the schedule)."
            echo "run=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Active ($n)."; echo "run=yes" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'yes'
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - if: steps.gate.outputs.run == 'yes'
        run: npm install --no-audit --no-fund
      # No browser download: the runner's own Google Chrome is used (chromium.launch({ channel: 'chrome' })).
      - if: steps.gate.outputs.run == 'yes'
        run: xvfb-run -a node watch.js ${{ inputs.dry && '--dry' || '' }} ${{ inputs.debug && '--debug' || '' }} ${{ inputs.discover && '--discover' || '' }} ${{ inputs.report && '--report' || '' }} ${{ inputs.daily && '--daily' || '' }}
        env: { HEADFUL: '1', DISCORD_WEBHOOK_URL: '${{ secrets.DISCORD_WEBHOOK_URL }}', GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}', GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}' }
      - if: steps.gate.outputs.run == 'yes' && inputs.dry
        uses: actions/upload-artifact@v4
        with: { name: charts, path: game-price-watcher/charts/, if-no-files-found: ignore }
      - name: Save state
        if: steps.gate.outputs.run == 'yes' && inputs.dry != true
        run: |
          git config user.name game-price-watcher && git config user.email game-price-watcher@users.noreply.github.com
          git add state/ && (git diff --cached --quiet || (git commit -m "game prices: update state" && for i in 1 2 3 4; do git pull --rebase -q -X theirs && git push -q && break; sleep $((i*4)); done))
# schedule registered by lostak
