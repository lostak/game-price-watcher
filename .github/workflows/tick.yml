name: tick
# Heartbeat, every ~5 minutes around the clock. Each run: reads new Discord commands in the game-prices channel,
# posts the day's picks lineup to #general once, first try 6:30 AM (picks.js),
# starts the price check every 5 minutes (5 AM–10 PM, while a home game is within 14 days) and the price board on the
# first tick after 7:15 AM, then waits out the rest of its 5 minutes and starts the next tick. GitHub's own cron is
# unreliable (often hours late), so cron here only restarts the chain if it ever stops.
on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:
concurrency: { group: tick, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: game-price-watcher } }
    steps:
      - id: t0
        working-directory: .
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - name: Discord commands
        id: cmd
        env:
          DISCORD_BOT_TOKEN: '${{ secrets.DISCORD_BOT_TOKEN }}'
          DISCORD_CHANNEL_ID: '${{ secrets.DISCORD_CHANNEL_ID }}'
          DISCORD_WEBHOOK_URL: '${{ secrets.DISCORD_WEBHOOK_URL }}'
          GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}'
          GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}'
        run: |
          set +e; node commands.js; rc=$?; set -e
          [ "$rc" = "3" ] && echo "changed=yes" >> "$GITHUB_OUTPUT"
          [ "$rc" = "4" ] && echo "report=yes" >> "$GITHUB_OUTPUT"
          [ "$rc" = "0" ] || [ "$rc" = "3" ] || [ "$rc" = "4" ] || [ "$rc" = "5" ] || echo "::warning::commands.js exited $rc"
      - name: Forward new calendar alerts to Bradley's Discord DMs
        env:
          GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}'
          GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}'
          DISCORD_BOT_TOKEN: '${{ secrets.DISCORD_BOT_TOKEN }}'
          DISCORD_CHANNEL_ID: '${{ secrets.DISCORD_CHANNEL_ID }}'
        run: node forward.js || echo "::warning::Calendar → Discord DM forward failed – see log."
      - name: Watchdog (golf + powder loops, and the morning betting slate)
        env:
          GH_API_TOKEN: '${{ github.token }}'
          GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}'
          GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}'
          DISCORD_BOT_TOKEN: '${{ secrets.DISCORD_BOT_TOKEN }}'
          DISCORD_CHANNEL_ID: '${{ secrets.DISCORD_CHANNEL_ID }}'
        run: node watchdog.js "lostak/golf-watcher:tick.yml,lostak/powder-report:powder-report.yml" --slate || echo "::warning::watchdog failed"
      - name: Morning brief (from 6:45 AM, once a day; waits for the betting slate until 7:15)
        env:
          GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}'
          GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}'
        run: |
          hm=$((10#$(TZ=America/Denver date +%H%M)))
          if [ "$hm" -ge 645 ] && [ "$hm" -lt 1100 ]; then node brief.js || echo "::warning::morning brief failed – see log"; fi
      - name: Auto-grade finished picks from ESPN (noon to 6:10 AM)
        env:
          GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}'
          GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}'
        run: |
          hm=$((10#$(TZ=America/Denver date +%H%M)))
          if [ "$hm" -ge 1200 ] || [ "$hm" -lt 610 ]; then node grade.js || echo "::warning::grading failed – see log"; fi
      - name: Weekly betting recap (Sundays from 7 PM)
        env:
          GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}'
          GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}'
        run: |
          if [ "$(TZ=America/Denver date +%u)" = 7 ] && [ "$((10#$(TZ=America/Denver date +%H%M)))" -ge 1900 ]; then node recap.js || echo "::warning::recap failed – see log"; fi
      - name: Pool focus (from 4:37 PM) and ski workout (from 7:37 PM), once a day each
        env:
          GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}'
          GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}'
        run: |
          hm=$((10#$(TZ=America/Denver date +%H%M)))
          if [ "$hm" -ge 1637 ] && [ "$hm" -lt 2100 ]; then node rotations.js pool || echo "::warning::pool focus failed – see log"; fi
          if [ "$hm" -ge 1937 ] && [ "$hm" -lt 2200 ]; then node rotations.js ski || echo "::warning::ski workout failed – see log"; fi
      - name: Picks for #general (from 6:30 AM Denver, once a day)
        env:
          GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}'
          GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}'
          DISCORD_BOT_TOKEN: '${{ secrets.DISCORD_BOT_TOKEN }}'
          DISCORD_WEBHOOK_PICKS: '${{ secrets.DISCORD_WEBHOOK_PICKS }}'
        run: |
          hm=$((10#$(TZ=America/Denver date +%H%M))); today=$(TZ=America/Denver date +%F)
          done=$(node -e "try{console.log(require('./state/picks.json').date||'')}catch{console.log('')}")
          if [ "$hm" -ge 630 ] && [ "$hm" -lt 1100 ] && [ "$done" != "$today" ]; then   # first try 6:30 (the slate task writes it ~6:20)
            set +e; node picks.js; rc=$?; set -e
            [ "$rc" = "2" ] && echo "::warning::Picks can't be posted: the calendar isn't connected (GCAL_SA_KEY)."
            [ "$rc" = "1" ] && echo "::warning::Picks post failed – see log."
          fi
          # 6:50 AM check: is today's lineup really in #general? If not, retry once and DM Bradley why (once a day).
          checked=$(node -e "try{console.log(require('./state/picks.json').checked||'')}catch{console.log('')}")
          if [ "$hm" -ge 650 ] && [ "$hm" -lt 1100 ] && [ "$checked" != "$today" ]; then node picks.js --check || echo "::warning::Picks check failed – see log."; fi
          true
      - name: Morning freshness check of the whole project (from 7:40 AM, once a day; DMs only if something is stale)
        env:
          GCAL_SA_KEY: '${{ secrets.GCAL_SA_KEY }}'
          GCAL_CALENDAR_ID: '${{ secrets.GCAL_CALENDAR_ID }}'
          DISCORD_BOT_TOKEN: '${{ secrets.DISCORD_BOT_TOKEN }}'
          DISCORD_CHANNEL_ID: '${{ secrets.DISCORD_CHANNEL_ID }}'
        run: |
          hm=$((10#$(TZ=America/Denver date +%H%M))); today=$(TZ=America/Denver date +%F)
          done=$(node -e "try{console.log(require('./state/fresh.json').date||'')}catch{console.log('')}")
          if [ "$hm" -ge 740 ] && [ "$hm" -lt 1200 ] && [ "$done" != "$today" ]; then node fresh.js || echo "::warning::freshness check failed – see log"; fi
          true
      - name: Save cursor / wants
        run: |
          git config user.name game-price-watcher && git config user.email game-price-watcher@users.noreply.github.com
          git add state/ wants.json; git diff --cached --quiet || (git commit -q -m "tick: discord state" && git pull --rebase -q -X theirs && git push -q) || true
      - name: Start what's due
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          h=$((10#$(TZ=America/Denver date +%H))); m=$((10#$(TZ=America/Denver date +%M))); today=$(TZ=America/Denver date +%F)
          last() { gh run list -R "$GITHUB_REPOSITORY" -w game-prices.yml -L 1 --json createdAt,status --jq '.[0] // {} | "\(.status // "none") \(.createdAt // "1970-01-01T00:00:00Z")"'; }
          read -r st created <<< "$(last)"; age=$(( $(date +%s) - $(date -d "$created" +%s) ))
          active=$(node -e "
            const c=require('./wants.json'), s=require('./state/games.json');
            const until=new Date(Date.now()+(c.daysAhead||14)*864e5).toISOString().slice(0,10);
            const g=[...(s.games||[]).filter(x=>x.date<=until),...(c.games||[])].filter(x=>x.date>='$today');
            const stale=!s.updated||Date.now()-Date.parse(s.updated)>864e5;
            console.log(g.length||stale?'yes':'no')")
          rep=$(node -e "try{console.log(require('./state/report.json')._date||'')}catch{console.log('')}")
          echo "Denver $h:$m · last price check $st, ${age}s ago · active=$active · board posted: ${rep:-never}"
          inhours=no; [ "$h" -ge 5 ] && [ "$h" -lt 22 ] && inhours=yes
          board=no; [ "$rep" != "$today" ] && [ "$h" -lt 21 ] && { [ "$h" -gt 7 ] || { [ "$h" -eq 7 ] && [ "$m" -ge 15 ]; }; } && board=yes
          asked=${{ steps.cmd.outputs.report == 'yes' && 'yes' || 'no' }}; changed=${{ steps.cmd.outputs.changed == 'yes' && 'yes' || 'no' }}
          if [ "$st" != "completed" ] && [ "$st" != "none" ]; then echo "price check still running"; exit 0; fi
          if [ "$asked" = yes ]; then gh workflow run game-prices.yml -R "$GITHUB_REPOSITORY" --ref main -f report=true && echo "→ board (asked for)"
          elif [ "$changed" = yes ] || { [ "$inhours" = yes ] && [ "$board" = yes ]; }; then gh workflow run game-prices.yml -R "$GITHUB_REPOSITORY" --ref main -f daily=true && echo "→ price check + daily board"
          elif ls state/graph-requests/*.json >/dev/null 2>&1; then gh workflow run game-prices.yml -R "$GITHUB_REPOSITORY" --ref main && echo "→ price check + requested graphs"
          elif [ "$inhours" = yes ] && [ "$active" = yes ] && [ "$age" -ge 240 ]; then gh workflow run game-prices.yml -R "$GITHUB_REPOSITORY" --ref main && echo "→ price check"
          fi
      - name: Next tick in 5 minutes
        if: always()
        working-directory: .
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          left=$(( 300 - ($(date +%s) - ${{ steps.t0.outputs.t }}) )); [ "$left" -gt 0 ] && sleep "$left"
          # GitHub sometimes answers a dispatch with a 500 (that broke the chain on Nov 8); retry, then clear a run stuck in "queued"
          for i in 1 2 3 4 5; do
            gh workflow run tick.yml -R "$GITHUB_REPOSITORY" --ref main && exit 0
            echo "dispatch failed (try $i) – retrying"; sleep $((i * 20))
            for id in $(gh run list -R "$GITHUB_REPOSITORY" -w tick.yml -s queued --json databaseId,createdAt -q '.[] | select((now - (.createdAt | fromdate)) > 600) | .databaseId'); do gh run cancel "$id" -R "$GITHUB_REPOSITORY" || true; done
          done
          exit 1
# schedule registered by lostak
