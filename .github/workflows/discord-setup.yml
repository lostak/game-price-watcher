name: discord slash commands
# info: prints the bot's public key and the server id (both public) for the Cloudflare helper.
# register: installs the slash commands in discord-worker/commands.json on the server (run after the helper is live).
on:
  workflow_dispatch:
    inputs:
      action: { description: 'info or register', type: choice, options: [info, check, register], default: info }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { TOKEN: '${{ secrets.DISCORD_BOT_TOKEN }}', CHANNEL: '${{ secrets.DISCORD_CHANNEL_ID }}', ACTION: '${{ inputs.action }}' }
        run: |
          TOKEN=$(printf '%s' "$TOKEN" | awk 'NF{print $1; exit}'); CHANNEL=$(printf '%s' "$CHANNEL" | awk 'NF{print $1; exit}')
          api() { curl -sS -H "Authorization: Bot $TOKEN" -H "Content-Type: application/json" "$@"; }
          app=$(api https://discord.com/api/v10/oauth2/applications/@me)
          app_id=$(echo "$app" | jq -r .id); key=$(echo "$app" | jq -r .verify_key)
          guild=$(api https://discord.com/api/v10/channels/$CHANNEL | jq -r .guild_id)
          echo "APP_ID=$app_id"; echo "PUBLIC_KEY=$key"; echo "GUILD_ID=$guild"
          echo "INTERACTIONS_URL=$(echo "$app" | jq -r '.interactions_endpoint_url // "not set"')"
          # personal-looking posts still sitting in the shared #general channel (the old welcome post)
          api "https://discord.com/api/v10/channels/1568311701701398641/messages?limit=50" | jq -r '.[] | select((.content // "") | test("welcome|morning brief|bills|Slack|golf|powder"; "i")) | "GENERAL_OLD_POST \(.timestamp[0:10]) \(.author.username): \(.content[0:80] | gsub("\n"; " "))"' || true
          if [ "$ACTION" = check ]; then   # can the bot install commands here? (installs none)
            api -X PUT "https://discord.com/api/v10/applications/$app_id/guilds/$guild/commands" --data '[]' | jq -c .
          fi
          if [ "$ACTION" = register ]; then
            api -X PUT "https://discord.com/api/v10/applications/$app_id/guilds/$guild/commands" --data @discord-worker/commands.json | jq -r 'if type=="array" then "registered: " + ([.[].name]|join(", ")) else . end'
          fi
